{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FakeOut</title>
    <link rel="stylesheet" href="{% static 'FakeOutApp/css/style.css' %}">
</head>

<body>

    <div class="auth-page">
        <div class="auth-visual">
            <a href="{% url 'FakeOutApp:home' %}" class="brand">
                <span class="brand-badge">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L4 5v6c0 5.25 3.4 9.74 8 11 4.6-1.26 8-5.75 8-11V5l-8-3z" fill="currentColor" />
                        <path d="M9 12l2 2 4-4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </span>
                FakeOut
            </a>

            <div class="auth-visual-copy">
                <h1>Welcome Back!</h1>
                <p>Login to access your dashboard and scan history.</p>
            </div>

            <div class="auth-illustration">
                <svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="70" cy="60" r="34" fill="#dce8ff" />
                    <rect x="20" y="95" width="100" height="60" rx="10" fill="#c9daff" />
                    <rect x="35" y="60" width="70" height="45" rx="6" fill="#fff" />
                </svg>
                <span class="auth-lock-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
                        <rect x="5" y="11" width="14" height="9" rx="2" />
                        <path d="M8 11V8a4 4 0 0 1 8 0v3" />
                    </svg>
                </span>
            </div>
        </div>

        <div class="auth-form-side">
            <div class="auth-form-card">
                <h2>Login</h2>

                {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                    {% endfor %}
                </div>
                {% endif %}

                <form method="post" action="{% url 'FakeOutApp:login' %}" novalidate>
                    {% csrf_token %}
                    <div class="form-row">
                        <label for="id_email">Email address</label>
                        <input type="email" id="id_email" name="email" placeholder="you@example.com" value="{{ form_data.email|default:'' }}" required>
                    </div>
                    <div class="form-row">
                        <label for="id_password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="id_password" name="password" placeholder="••••••••" required>
                            <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                                <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="form-meta">
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg btn-block">Login</button>
                </form>

                <p class="auth-switch">
                    Don't have an account? <a href="{% url 'FakeOutApp:signup' %}">Sign up</a>
                </p>
            </div>
        </div>
    </div>

    <script src="{% static 'FakeOutApp/js/script.js' %}"></script>
</body>

</html>
